name: a2emu
services:
  a2emu:
    image: theredhead/a2emu:latest
    restart: unless-stopped
    init: true
    volumes:
      - a2emu-data:/data
    expose:
      - "80"
    environment:
      NODE_ENV: production
      PORT: "80"
      DATA_DIR: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  a2emu-data:
